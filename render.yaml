# Render blueprint for the inference API (FastAPI, Docker).
# The Streamlit UI is deployed separately on Streamlit Community Cloud (see docs/despliegue.md).
services:
  - type: web
    name: site-selection-api
    runtime: docker
    dockerfilePath: ./Dockerfile
    plan: free
    healthCheckPath: /health
    envVars:
      - key: SERVING_MODEL
        value: v3            # switch to v4 once demographic data is loaded
      - key: SERVING_CORS_ORIGINS
        value: "*"           # restrict to the Streamlit domain in production
