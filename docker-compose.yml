# Dedicated PostGIS for Site Selection Engine.
#
# PORT NOTE: host port 5432 is already taken by the EUDR project's container
# (eudr_postgis). To avoid a collision, this service exposes PostGIS on host
# port 5433 -> container 5432. The default DATABASE_URL in src/config.py
# points to 5433 accordingly. Override with the DATABASE_URL environment
# variable if you want a different target.
services:
  postgis:
    image: postgis/postgis:16-3.4
    container_name: site_selection_postgis
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: site_selection
    ports:
      - "5433:5432"
    volumes:
      - site_selection_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d site_selection"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  site_selection_pgdata:
