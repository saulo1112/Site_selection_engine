[project]
name = "site-selection-engine"
version = "0.1.0"
description = "Ranking of candidate locations (H3 grid) for retail/franchise expansion in Colombia, using a look-alike approach on D1 Stores (OSM + DANE + road accessibility)."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    # --- Tabular ---
    "pandas>=2.0",
    "numpy>=1.24",
    # --- Geospatial core ---
    "geopandas>=0.14",
    "shapely>=2.0",
    "pyproj>=3.6",
    "fiona>=1.9",
    # --- Hexagonal grid (unit of analysis) ---
    "h3>=4.0",
    # --- OSM / Overpass + road network ---
    "requests>=2.31",
    "osmnx>=1.9",
    # --- ML (v2/v3) ---
    "scikit-learn>=1.4",
    # --- Spatial database (PostGIS) ---
    "sqlalchemy>=2.0",
    "psycopg2-binary>=2.9",
    "geoalchemy2>=0.15",
    # --- Columnar IO (features.parquet) ---
    "pyarrow>=15.0",
    # --- Exploratory visualization ---
    "matplotlib>=3.8",
    "folium>=0.16",
    # --- Utilities ---
    "tqdm>=4.66",
    "python-dotenv>=1.0",
    "tabulate>=0.9",
    # --- Serving / API (inference layer, decoupled from PostGIS) ---
    "fastapi>=0.110",
    "uvicorn[standard]>=0.29",
    "pydantic>=2.0",
    # --- Frontend (interactive hexagon map) ---
    "streamlit>=1.33",
    "pydeck>=0.9",
]

[dependency-groups]
dev = [
    "jupyterlab>=4.0",
    "ipykernel>=6.29",
]

# DECIDED deployment stack: hybrid FastAPI (serving) + Streamlit/pydeck (UI),
# with a live demo. Serving reads versioned artifacts (parquet rankings, .joblib,
# GeoJSON POIs); PostGIS is only used for the local ETL. See docs/despliegue.md.
#
# Serving extras (install only on the API host for a lighter image):
#   uv pip install fastapi "uvicorn[standard]" pydantic pandas pyarrow scikit-learn h3 joblib
[project.optional-dependencies]
serving = [
    "fastapi>=0.110",
    "uvicorn[standard]>=0.29",
    "pydantic>=2.0",
    "pandas>=2.0",
    "pyarrow>=15.0",
    "scikit-learn>=1.4",
    "h3>=4.0",
    "joblib>=1.3",
]
